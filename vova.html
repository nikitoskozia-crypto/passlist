<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#1e3a5f">
    <title>Владимир Л. | Учёт пассажиров</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: #f0f2f5;
            color: #1a1a1a;
            padding: 12px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #1e3a5f;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #1e3a5f;
            padding: 8px 12px;
            border-radius: 40px;
            min-width: 44px;
            min-height: 44px;
        }

        .back-btn:active {
            background: #e0e7f0;
        }

        .subtitle {
            color: #666;
            margin-bottom: 16px;
            border-left: 4px solid #1e3a5f;
            padding-left: 12px;
            font-size: 14px;
        }

        .dates-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 8px 0 16px 0;
            margin-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .date-chip {
            background: white;
            border: 1px solid #ddd;
            border-radius: 40px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            min-height: 44px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .date-chip:active {
            transform: scale(0.97);
            background: #eef2f6;
        }

        .date-chip.active {
            background: #1e3a5f;
            color: white;
            border-color: #1e3a5f;
        }

        .date-chip .date-seats {
            font-size: 10px;
            opacity: 0.8;
        }

        .time-group {
            background: white;
            border-radius: 16px;
            margin-bottom: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .time-header {
            background: #1e3a5f;
            color: white;
            padding: 14px 18px;
            font-weight: 700;
            font-size: 17px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 52px;
        }

        .time-header:active {
            background: #2c4a6e;
        }

        .time-header .time-seats {
            font-size: 14px;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 40px;
        }

        .time-content {
            padding: 0;
            display: none;
        }

        .summary-block {
            background: #f8f9fa;
            padding: 14px 18px;
            cursor: pointer;
            border-bottom: 1px solid #eef2f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .summary-block:active {
            background: #eef2f6;
        }

        .summary-title {
            font-weight: 600;
            font-size: 15px;
            color: #1e3a5f;
        }

        .summary-seats {
            background: #e0e7f0;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
        }

        .route-detail {
            border-bottom: 1px solid #eef2f6;
            padding: 14px 16px;
        }

        .route-title {
            font-weight: 700;
            font-size: 16px;
            color: #1e3a5f;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 2px solid #1e3a5f;
            display: inline-block;
        }

        .route-total {
            font-size: 13px;
            color: #003cff;
            font-weight: 600;
            margin-left: 10px;
            display: inline-block;
        }

        .table-wrapper {
            overflow-x: auto;
            margin-top: 10px;
            border-radius: 14px;
            -webkit-overflow-scrolling: touch;
        }

        /* ТАБЛИЦА - ТОЧНО КАК У ВЛАДЕЛЬЦА */
        .passengers-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            min-width: 650px;
            font-size: 14px;
        }

        .passengers-table th,
        .passengers-table td {
            padding: 14px 14px;
            text-align: left;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        .passengers-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #555;
            font-size: 13px;
        }

        /* ОПЛАТА - ТОЧНО КАК У ВЛАДЕЛЬЦА (с примечанием для безнала) */
        .payment-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
        }

        .payment-cash {
            background: #d4edda;
            color: #04701d;
            border: 1px solid #c3e6cb;
        }

        .payment-cashless {
            background: #e8d9ff;
            color: #2b0367;
            border: 1px solid #d1c4e9;
        }

        /* КНОПКА ЯВКИ - ТОЧНО КАК У ВЛАДЕЛЬЦА */
        .btn-presence {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            border: 2px solid #e0e6ed;
            background: transparent;
            color: #8395a7;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 90px;
            min-height: 34px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .btn-presence:active {
            transform: scale(0.95);
        }

        .btn-presence.checked {
            background: linear-gradient(135deg, #3cba0a 0%, #3cba0a 100%);
            color: white;
            border-color: #3cba0a;
            box-shadow: 0 4px 12px rgba(68, 189, 50, 0.35);
        }

        .btn-presence:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 16px;
            color: #999;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 14px;
        }

        .info-note {
            background: #e8f4fd;
            border-radius: 12px;
            padding: 10px 14px;
            margin-top: 16px;
            font-size: 11px;
            color: #1e3a5f;
        }

        .check-cell {
            text-align: center !important;
            width: 110px;
        }

        @media (max-width: 700px) {
            .passengers-table {
                font-size: 13px;
                min-width: 600px;
            }
            .passengers-table th,
            .passengers-table td {
                padding: 10px 10px;
            }
            .btn-presence {
                padding: 4px 10px;
                font-size: 10px;
                min-width: 80px;
                min-height: 30px;
            }
            .payment-badge {
                padding: 3px 10px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 8px;">
            <h1>
                <button class="back-btn" id="backBtn" style="display: none;">←</button>
                <span id="pageTitle">🚛 Владимир Л. — Учёт пассажиров</span>
            </h1>
        </div>

        <div class="subtitle" id="subtitle">Ваши рейсы на ближайшие дни</div>
        <div id="mainContent">
            <div class="loading">Загрузка...</div>
        </div>
        <div class="info-note" id="driverNote">Здесь отображаются только рейсы, где в колонке "Водитель" указано "Владимир Л."</div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxBeKVIwCUN-pcI2WvdzziYUNQgB3XrKiNfDhzloOJN3Pq2_MfUmlzXxg1huSQ5l_1BZA/exec';
        const TIME_ORDER = ['03:30', '10:00', '11:30', '14:00', '15:30', '16:30', '18:00', '21:30'];
        const MY_DRIVER_NAME = 'Владимир Л.';
        let currentDriver = MY_DRIVER_NAME;
        let allData = [];
        let currentView = 'dates';
        let selectedDate = null;

        // Хранилище для отметок явки (локальное)
        const STORAGE_CHECKS_KEY = 'arrivalChecks_vladimir';
        let arrivalChecks = {};

        function loadChecksFromStorage() {
            const saved = localStorage.getItem(STORAGE_CHECKS_KEY);
            if (saved) arrivalChecks = JSON.parse(saved);
        }

        function saveCheckToStorage(key, isChecked) {
            if (isChecked) arrivalChecks[key] = true;
            else delete arrivalChecks[key];
            localStorage.setItem(STORAGE_CHECKS_KEY, JSON.stringify(arrivalChecks));
        }

        // ФОРМАТИРОВАНИЕ ОПЛАТЫ - ТОЧНО КАК У ВЛАДЕЛЬЦА
        // Примеры: "Безнал", "Безнал (РосБилет)", "Нал 500 ₽", "Наличные"
       function formatPayment(payment, note) {
        const noteStr = note ? ` (${note})` : '';
        if (!payment || payment === '') return `<span class="payment-badge payment-cashless">Безнал${noteStr}</span>`;
        const lowerPayment = payment.toLowerCase();
        if (lowerPayment.includes('нал') || lowerPayment.includes('налич') || /^\d/.test(payment)) {
            const moneyMatch = payment.match(/\d+/);
            if (moneyMatch) return `<span class="payment-badge payment-cash">Нал ${moneyMatch[0]} ₽</span>`;
            return `<span class="payment-badge payment-cash">Наличные</span>`;
        }
        if (lowerPayment.includes('безнал') || lowerPayment === 'без') return `<span class="payment-badge payment-cashless">Безнал${noteStr}</span>`;
        return `<span class="payment-badge payment-cashless">${payment}${noteStr}</span>`;
    }


        function filterByDriver(data) {
            if (currentDriver === 'all') return data;
            return data.filter(item => item.driver === currentDriver);
        }

        function parseDate(dateStr) {
            if (!dateStr || typeof dateStr !== 'string') return new Date();
            let parts = dateStr.split('.');
            if (parts.length === 3) return new Date(parseInt(parts[2], 10), parseInt(parts[1], 10) - 1, parseInt(parts[0], 10));
            return new Date(dateStr);
        }

        function isDateUpcoming(dateStr) {
            let today = new Date();
            today.setHours(0, 0, 0, 0);
            let date = parseDate(dateStr);
            date.setHours(0, 0, 0, 0);
            return date >= today;
        }

        function getUpcomingDates(datesArray, limit = 7) {
            let futureDates = datesArray.filter(date => isDateUpcoming(date));
            futureDates.sort((a, b) => parseDate(a) - parseDate(b));
            return futureDates.slice(0, limit);
        }

        function convertDate(rawDate) {
            if (!rawDate) return '';
            let d = new Date(rawDate);
            if (!isNaN(d.getTime())) {
                let day = d.getDate(), month = d.getMonth() + 1, year = d.getFullYear();
                return (day < 10 ? '0' + day : day) + '.' + (month < 10 ? '0' + month : month) + '.' + year;
            }
            return String(rawDate);
        }

        function convertTime(rawTime) {
            if (!rawTime) return '';
            if (typeof rawTime === 'string') {
                let match = rawTime.match(/(\d{2}):(\d{2})/);
                if (match) return match[1] + ':' + match[2];
            }
            let t = new Date(rawTime);
            if (!isNaN(t.getTime())) {
                return String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
            }
            return String(rawTime).trim().substring(0, 5);
        }

        async function loadData() {
            try {
                const noCacheUrl = API_URL + (API_URL.includes('?') ? '&' : '?') + '_nocache=' + Date.now();
                const response = await fetch(noCacheUrl);
                const data = await response.json();

                allData = data.map(item => ({
                    rowId: item.rowId,
                    date: convertDate(item.date),
                    route: item.route,
                    time: convertTime(item.time),
                    name: item.name || 'Имя не указано',
                    phone: item.phone || '—',
                    seats: item.seats ? Number(item.seats) : 1,
                    driver: item.driver || 'Не назначен',
                    payment: item.payment || '',
                    note: item.note || '',
                    checked: !!item.checked
                })).filter(item => item.date && item.route && item.time);

                renderCurrentView();
            } catch (error) {
                document.getElementById('mainContent').innerHTML = `<div class="empty-state">Ошибка: ${error.message}</div>`;
            }
        }

   // ОБНОВЛЕННАЯ ФУНКЦИЯ ЯВКИ
async function savePresenceToLocal(rowId, isChecked, element) {
    element.disabled = true;
    const originalText = element.innerHTML;
    element.innerHTML = '⏳...';

    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            // Убираем mode: 'no-cors'
            headers: { 'Content-Type': 'text/plain' }, // Для Google Script лучше использовать text/plain при POST
            body: JSON.stringify({
                rowId: rowId,
                checked: isChecked,
                type: 'present'
            })
        });

        // Если дошли сюда, значит запрос ушел
        saveCheckToStorage(`presence_${rowId}`, isChecked);
        const item = allData.find(d => d.rowId === rowId);
        if (item) item.checked = isChecked;
        
        element.classList.toggle('checked', isChecked);
        element.innerHTML = isChecked ? '✅ На месте' : '⏳ Ожидание';
    } catch (error) {
        // Если ошибка здесь, значит скрипт был развернут не как "Web App" или не с нужными правами
        console.error('Ошибка:', error);
        alert('Ошибка сервера. Убедитесь, что скрипт опубликован с доступом для всех.');
        element.innerHTML = originalText;
    } finally {
        element.disabled = false;
    }
}

        function getFilteredData() { return filterByDriver(allData); }
        function getUniqueDates() { return getUpcomingDates([...new Set(getFilteredData().map(item => item.date))], 7); }
        function getTotalSeatsForDate(date) { return getFilteredData().filter(item => item.date === date).reduce((sum, item) => sum + item.seats, 0); }

        function renderCurrentView() {
            if (currentView === 'dates') renderDatesView();
            else renderTimesView();
            document.getElementById('backBtn').style.display = currentView === 'dates' ? 'none' : 'inline-block';
        }

        function renderDatesView() {
            const container = document.getElementById('mainContent');
            const dates = getUniqueDates();
            if (dates.length === 0) {
                container.innerHTML = '<div class="empty-state">Нет рейсов</div>';
                return;
            }
            container.innerHTML = `<div class="dates-scroll">${dates.map(date => `<div class="date-chip" data-date="${date}">${date}<span class="date-seats">${getTotalSeatsForDate(date)} м</span></div>`).join('')}</div><div id="timesContainer"></div>`;
            document.querySelectorAll('.date-chip').forEach(chip => {
                chip.onclick = () => {
                    selectedDate = chip.dataset.date;
                    document.querySelectorAll('.date-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    currentView = 'times';
                    renderCurrentView();
                };
            });
            if (selectedDate && dates.includes(selectedDate)) {
                const activeChip = document.querySelector(`.date-chip[data-date="${selectedDate}"]`);
                if (activeChip) activeChip.classList.add('active');
            } else if (dates.length > 0) {
                document.querySelector('.date-chip').click();
            }
        }

        function renderTimesView() {
            const container = document.getElementById('timesContainer') || document.getElementById('mainContent');
            if (!selectedDate) return;
            
            let filtered = getFilteredData().filter(item => item.date === selectedDate);
            const timeSlots = [];
            TIME_ORDER.forEach(t => {
                const items = filtered.filter(f => f.time === t);
                if (items.length > 0) timeSlots.push({ time: t, items });
            });

            if (timeSlots.length === 0) {
                container.innerHTML = '<div class="empty-state">Нет рейсов на выбранную дату</div>';
                return;
            }

            container.innerHTML = timeSlots.map(slot => `
                <div class="time-group">
                    <div class="time-header" data-time="${slot.time}">
                        <span>${slot.time}</span>
                        <span class="time-seats">${slot.items.reduce((s, i) => s + i.seats, 0)} мест</span>
                    </div>
                    <div class="time-content" id="tc-${slot.time.replace(':', '')}" style="display:none">
                        ${[...new Set(slot.items.map(i => i.route))].map(route => {
                            const passengers = slot.items.filter(i => i.route === route);
                            const totalSeats = passengers.reduce((s, p) => s + p.seats, 0);
                            return `
                            <div class="route-detail">
                                <div>
                                    <span class="route-title">${route.replace('-', ' → ')}</span>
                                    <span class="route-total">${totalSeats} чел</span>
                                </div>
                                <div class="table-wrapper">
                                    <table class="passengers-table">
                                        <thead>
                                            <tr>
                                                <th>№</th>
                                                <th>ФИО</th>
                                                <th>Телефон</th>
                                                <th>Мест</th>
                                                <th>Оплата</th>
                                                <th>Явка</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${passengers.map((p, idx) => {
                                                const presenceKey = `presence_${p.rowId}`;
                                                const isPresent = arrivalChecks[presenceKey] || p.checked || false;
                                                return `
                                                <tr>
                                                    <td>${idx + 1}</td>
                                                    <td><strong>${escapeHtml(p.name)}</strong></td>
                                                    <td>${escapeHtml(p.phone)}</small></td>
                                                    <td>${p.seats}</td>
                                                    <td>${formatPayment(p.payment, p.note)}</small></td>
                                                    <td class="check-cell">
                                                        <button class="btn-presence ${isPresent ? 'checked' : ''}" data-rowid="${p.rowId}">${isPresent ? '✅ На месте' : '⏳ Ожидание'}</button>
                                                    </td>
                                                </tr>`;
                                            }).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>
            `).join('');

            // Обработчики для заголовков времени
            document.querySelectorAll('.time-header').forEach(header => {
                const time = header.dataset.time;
                const content = document.getElementById(`tc-${time.replace(':', '')}`);
                header.onclick = () => {
                    content.style.display = content.style.display === 'none' ? 'block' : 'none';
                };
            });

            // Обработчики для кнопок явки
            document.querySelectorAll('.btn-presence').forEach(btn => {
                btn.onclick = () => {
                    const rowId = Number(btn.dataset.rowid);
                    const isCurrentlyChecked = btn.classList.contains('checked');
                    savePresenceToLocal(rowId, !isCurrentlyChecked, btn);
                };
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        document.getElementById('backBtn').onclick = () => {
            currentView = 'dates';
            selectedDate = null;
            renderCurrentView();
        };

        loadChecksFromStorage();
        loadData();
    </script>
</body>

</html>
