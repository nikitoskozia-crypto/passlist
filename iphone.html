<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#0f172a">
    <title>Пассажиры | Панель управления</title>
    <style>
        :root {
            --bg-page: #f8fafc;
            --primary: #0f172a;
            --accent: #4f46e5;
            --accent-light: #eef2ff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --border: #f1f5f9;
            --success: #10b981;
            --success-bg: #ecfdf5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-page); 
            color: var(--text-main); 
            padding: 16px;
            line-height: 1.4;
        }

        .container { max-width: 600px; margin: 0 auto; }
        
        /* Шапка */
        header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 22px; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }
        
        /* Выбор водителя в виде компактного статус-бара */
        .driver-panel {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.03);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .driver-panel select { 
            padding: 8px 12px; 
            border-radius: 10px; 
            border: 1px solid var(--border); 
            font-size: 14px; 
            font-weight: 600;
            background: #f8fafc;
            color: var(--primary);
            outline: none;
            cursor: pointer;
            flex-grow: 1;
        }
        .driver-indicator { font-size: 12px; font-weight: 700; color: #d97706; background: #fffbeb; padding: 4px 10px; border-radius: 8px; white-space: nowrap; }

        /* Современный горизонтальный календарь */
        .calendar-slider { 
            display: flex; 
            gap: 10px; 
            overflow-x: auto; 
            padding: 4px 4px 16px 4px; 
            margin-bottom: 12px; 
            -webkit-overflow-scrolling: touch; 
            scrollbar-width: none;
        }
        .calendar-slider::-webkit-scrollbar { display: none; }
        
        .calendar-card { 
            background: var(--card-bg); 
            border: 1px solid var(--border); 
            border-radius: 14px; 
            padding: 12px; 
            min-width: 76px;
            height: 80px;
            cursor: pointer; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .calendar-card .day-name { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); }
        .calendar-card .day-num { font-size: 20px; font-weight: 800; color: var(--primary); }
        .calendar-card .day-seats { font-size: 10px; font-weight: 700; color: var(--accent); background: var(--accent-light); padding: 2px 6px; border-radius: 6px; width: 100%; text-align: center; }
        
        .calendar-card.active { 
            background: var(--primary); 
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.15);
            transform: translateY(-2px);
        }
        .calendar-card.active .day-name { color: rgba(255,255,255,0.6); }
        .calendar-card.active .day-num { color: #ffffff; }
        .calendar-card.active .day-seats { color: #ffffff; background: rgba(255,255,255,0.15); }

        /* Сводный инфоблок дня */
        .day-info-bar { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 16px; padding-left: 4px; }
        
        /* Карточка рейса (Новая концепция вместо аккордеонов) */
        .trip-card {
            background: var(--card-bg);
            border-radius: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 24px rgba(15, 23, 42, 0.04);
            overflow: hidden;
        }
        
        /* Главная информация о рейсе */
        .trip-header {
            padding: 16px 20px;
            background: #ffffff;
            border-bottom: 1px solid #f8fafc;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .trip-route-box { display: flex; flex-direction: column; gap: 4px; }
        .trip-time { font-size: 22px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 6px; }
        .trip-route { font-size: 14px; font-weight: 700; color: var(--text-muted); }
        
        .trip-meta-box { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        .trip-seats-badge { background: var(--primary); color: #ffffff; font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 10px; }
        .trip-driver-badge { font-size: 11px; font-weight: 600; color: var(--text-muted); background: #f1f5f9; padding: 2px 8px; border-radius: 6px; }

        /* Список пассажиров внутри рейса */
        .passenger-list { padding: 8px 0; background: #fafbfc; }
        .passenger-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-bottom: 1px solid #f1f5f9;
        }
        .passenger-item:last-child { border-bottom: none; }
        
        .p-info { display: flex; flex-direction: column; gap: 2px; }
        .p-name { font-size: 15px; font-weight: 700; color: var(--primary); }
        .p-subrow { display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .p-phone { color: var(--accent); text-decoration: none; font-weight: 500; }
        .p-seats { font-weight: 700; color: var(--text-muted); background: #e2e8f0; padding: 1px 6px; border-radius: 4px; font-size: 11px; }
        
        .p-actions { display: flex; align-items: center; gap: 12px; }
        
        /* Бейджи оплаты */
        .pay-badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
        .pay-cash { background: #dcfce7; color: #15803d; }
        .pay-cashless { background: #f3e8ff; color: #6b21a8; }

        /* Чекбокс-кнопка */
        .check-btn {
            position: relative;
            width: 28px;
            height: 28px;
            cursor: pointer;
        }
        .check-btn input { position: absolute; opacity: 0; width: 0; height: 0; }
        .check-circle {
            position: absolute;
            top: 0; left: 0;
            width: 28px; height: 28px;
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
            transition: all 0.2s ease;
        }
        .check-btn input:checked ~ .check-circle {
            background: var(--success);
            border-color: var(--success);
        }
        .check-circle:after {
            content: "";
            position: absolute;
            display: none;
            left: 9px; top: 5px;
            width: 6px; height: 11px;
            border: solid white;
            border-width: 0 2.5px 2.5px 0;
            transform: rotate(45deg);
        }
        .check-btn input:checked ~ .check-circle:after { display: block; }

        /* Системные заглушки */
        .empty-state { text-align: center; padding: 40px 20px; background: var(--card-bg); border-radius: 20px; color: var(--text-muted); font-size: 14px; border: 1px dashed #cbd5e1; font-weight: 500; }
        .loading { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 15px; font-weight: 600; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>👥 Пассажиры</h1>
    </header>
    
    <div class="driver-panel">
        <select id="driverSelect">
            <option value="all">👑 Владелец (Все рейсы)</option>
            <option value="Алексей Б.">🚛 Алексей Б.</option>
            <option value="Андрей К.">🚛 Андрей К.</option>
            <option value="Валентин К.">🚛 Валентин К.</option>
        </select>
        <div class="driver-indicator" id="driverNote">Все направления</div>
    </div>
    
    <div id="calendarWrapper"></div>
    <div class="day-info-bar" id="dayInfoBar"></div>
    <div id="tripsListWrapper"><div class="loading">Синхронизация с таблицей...</div></div>
</div>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxxpd3Mcj0jD1OC46GmAifBJkgSV-Uw3mXqROdfbIMk7id4jrzdpWKFelB9PCVj6zJY4Q/exec';
    const TIME_ORDER = ['03:30', '10:00', '11:30', '14:00', '15:30', '16:30', '18:00', '21:30'];
    const WEEK_DAYS = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
    
    let allData = [];
    let selectedDate = null;
    let arrivalChecks = {};
    let currentDriver = 'all';
    
    function loadChecksFromStorage() {
        const saved = localStorage.getItem('arrivalChecks');
        if (saved) arrivalChecks = JSON.parse(saved);
    }
    
    function saveCheckToStorage(key, isChecked) {
        if (isChecked) arrivalChecks[key] = true;
        else delete arrivalChecks[key];
        localStorage.setItem('arrivalChecks', JSON.stringify(arrivalChecks));
    }
    
    function formatPayment(payment) {
        if (!payment || payment === '') return '<span class="pay-badge pay-cashless">Безнал</span>';
        const lower = payment.toLowerCase();
        if (lower.includes('нал') || lower.includes('налич') || /^\d/.test(payment)) {
            const num = payment.match(/\d+/);
            return `<span class="pay-badge pay-cash">${num ? num[0] + ' ₽' : 'Нал'}</span>`;
        }
        return `<span class="pay-badge pay-cashless">${payment}</span>`;
    }
    
    function parseDate(dateStr) {
        let parts = String(dateStr).split('.');
        if (parts.length === 3) return new Date(parts[2], parts[1] - 1, parts[0]);
        let hyphenParts = String(dateStr).split('-');
        if (hyphenParts.length === 3) return new Date(hyphenParts[0], hyphenParts[1] - 1, hyphenParts[2]);
        return new Date(dateStr);
    }
    
    function getDayName(dateStr) {
        let d = parseDate(dateStr);
        return isNaN(d.getTime()) ? '' : WEEK_DAYS[d.getDay()];
    }
    
    function convertDate(rawDate) {
        if (!rawDate) return '';
        if (typeof rawDate === 'string' && rawDate.match(/^\d{2}\.\d{2}\.\d{4}$/)) return rawDate;
        let d = new Date(rawDate);
        if (!isNaN(d.getTime())) {
            let day = d.getDate(), month = d.getMonth() + 1, year = d.getFullYear();
            return (day < 10 ? '0' + day : day) + '.' + (month < 10 ? '0' + month : month) + '.' + year;
        }
        return String(rawDate);
    }
    
    function convertTime(rawTime) {
        if (!rawTime) return '';
        let tStr = String(rawTime).trim();
        if (tStr.includes(':')) {
            let parts = tStr.split(':');
            if (parts[0].includes('T')) parts[0] = parts[0].split('T')[1];
            return parts[0].slice(-2) + ':' + parts[1].slice(0, 2);
        }
        return tStr;
    }
    
    async function loadData() {
        try {
            const noCacheUrl = API_URL + (API_URL.includes('?') ? '&' : '?') + '_nocache=' + Date.now();
            const response = await fetch(noCacheUrl);
            let data = await response.json();
            
            allData = data.map(item => {
                let seatsCount = item.seats ? Number(item.seats) : 1;
                if (isNaN(seatsCount) || seatsCount === 0) return null;
                return {
                    date: convertDate(item.date),
                    route: item.route,
                    time: convertTime(item.time),
                    name: item.name || 'Без имени',
                    phone: item.phone || '—',
                    seats: seatsCount,
                    driver: item.driver || 'Не назначен',
                    payment: item.payment || ''
                };
            }).filter(item => item !== null && item.date && item.route && item.time);
            
            renderCalendar();
        } catch (error) {
            console.error(error);
            document.getElementById('tripsListWrapper').innerHTML = '<div class="empty-state">Ошибка подключения к таблице.</div>';
        }
    }
    
    function getFilteredData() {
        if (currentDriver === 'all') return allData;
        return allData.filter(item => item.driver === currentDriver);
    }
    
    function getUniqueDates() {
        let filtered = getFilteredData();
        let dates = [...new Set(filtered.map(item => item.date))];
        let today = new Date(); today.setHours(0,0,0,0);
        
        return dates.filter(dStr => {
            let d = parseDate(dStr);
            d.setHours(0,0,0,0);
            return d >= today;
        }).sort((a,b) => parseDate(a) - parseDate(b)).slice(0, 7);
    }
    
    function renderCalendar() {
        const container = document.getElementById('calendarWrapper');
        const dates = getUniqueDates();
        
        if (dates.length === 0) {
            container.innerHTML = '';
            document.getElementById('dayInfoBar').innerHTML = '';
            document.getElementById('tripsListWrapper').innerHTML = '<div class="empty-state">Нет активных рейсов на ближайшие дни</div>';
            return;
        }
        
        container.innerHTML = `<div class="calendar-slider">${dates.map(date => {
            let totalSeats = getFilteredData().filter(item => item.date === date).reduce((s, item) => s + item.seats, 0);
            let dayNum = date.split('.')[0];
            let dayName = getDayName(date);
            return `
                <div class="calendar-card" data-date="${date}">
                    <span class="day-name">${dayName}</span>
                    <span class="day-num">${dayNum}</span>
                    <span class="day-seats">${totalSeats}м</span>
                </div>
            `;
        }).join('')}</div>`;
        
        document.querySelectorAll('.calendar-card').forEach(card => {
            card.onclick = () => {
                selectedDate = card.dataset.date;
                document.querySelectorAll('.calendar-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                renderTripsList();
            };
        });
        
        if (selectedDate && dates.includes(selectedDate)) {
            document.querySelector(`.calendar-card[data-date="${selectedDate}"]`)?.click();
        } else {
            document.querySelector('.calendar-card')?.click();
        }
    }
    
    function escapeHtml(str) {
        return (str || '').replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }
    
    function renderTripsList() {
        const wrapper = document.getElementById('tripsListWrapper');
        const infoBar = document.getElementById('dayInfoBar');
        
        let dayData = getFilteredData().filter(item => item.date === selectedDate);
        let totalDaySeats = dayData.reduce((s, item) => s + item.seats, 0);
        infoBar.innerHTML = `Выбрано: ${selectedDate} — Всего пассажиров: ${totalDaySeats} чел.`;
        
        // Группируем рейсы по времени из нашего TIME_ORDER
        let tripsHtml = '';
        let hasAnyTrips = false;
        
        TIME_ORDER.forEach(time => {
            let passengersAtTime = dayData.filter(item => item.time.substring(0, 5) === time);
            if (passengersAtTime.length === 0) return; // Убираем пустые времена, показываем только нужные
            
            hasAnyTrips = true;
            
            // Находим уникальные маршруты внутри этого времени
            let routesAtTime = [...new Set(passengersAtTime.map(p => p.route))];
            
            routesAtTime.forEach(route => {
                let list = passengersAtTime.filter(p => p.route === route);
                let routeSeats = list.reduce((s, p) => s + p.seats, 0);
                let driverName = list[0]?.driver || 'Не назначен';
                
                tripsHtml += `
                    <div class="trip-card">
                        <div class="trip-header">
                            <div class="trip-route-box">
                                <span class="trip-time">⏱️ ${time}</span>
                                <span class="trip-route">${escapeHtml(route.replace('-', ' → '))}</span>
                            </div>
                            <div class="trip-meta-box">
                                <span class="trip-seats-badge">${routeSeats} мест</span>
                                <span class="trip-driver-badge">👨‍✈️ ${escapeHtml(driverName)}</span>
                            </div>
                        </div>
                        <div class="passenger-list">
                            ${list.map((p, idx) => {
                                const checkKey = `${selectedDate}_${route}_${time}_${idx}`;
                                return `
                                    <div class="passenger-item">
                                        <div class="p-info">
                                            <span class="p-name">${escapeHtml(p.name)}</span>
                                            <div class="p-subrow">
                                                <a href="tel:${p.phone}" class="p-phone">${escapeHtml(p.phone)}</a>
                                                <span class="p-seats">${p.seats} мест</span>
                                            </div>
                                        </div>
                                        <div class="p-actions">
                                            ${formatPayment(p.payment)}
                                            <label class="check-btn">
                                                <input type="checkbox" class="passenger-check" data-key="${checkKey}" ${arrivalChecks[checkKey] ? 'checked' : ''}>
                                                <span class="check-circle"></span>
                                            </label>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            });
        });
        
        wrapper.innerHTML = hasAnyTrips ? tripsHtml : '<div class="empty-state">Нет пассажиров на эту дату</div>';
        
        document.querySelectorAll('.passenger-check').forEach(cb => {
            cb.onchange = () => saveCheckToStorage(cb.dataset.key, cb.checked);
        });
    }
    
    document.getElementById('driverSelect').onchange = (e) => {
        currentDriver = e.target.value;
        document.getElementById('driverNote').innerHTML = currentDriver === 'all' ? 'Все направления' : 'Фильтр активен';
        renderCalendar();
    };
    
    loadChecksFromStorage();
    loadData();
</script>
</body>
</html>
