<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#1e3a5f">
    <title>Владелец | Учёт пассажиров</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif; background: #f0f2f5; color: #1a1a1a; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 28px; margin-bottom: 8px; color: #1e3a5f; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .back-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #1e3a5f; padding: 5px 10px; border-radius: 40px; min-width: 44px; min-height: 44px; }
        .back-btn:active { background: #e0e7f0; }
        .subtitle { color: #666; margin-bottom: 20px; border-left: 4px solid #1e3a5f; padding-left: 15px; font-size: 14px; }

        .driver-selector {
            background: white;
            border-radius: 20px;
            padding: 16px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .driver-selector label { font-weight: 600; color: #1e3a5f; font-size: 15px; }
        .driver-selector select { 
            padding: 10px 16px; 
            border-radius: 40px; 
            border: 1px solid #ddd; 
            font-size: 15px; 
            background: white;
            min-width: 180px;
        }
        .driver-note { font-size: 13px; color: #e67e22; margin-left: auto; }

        .dates-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 10px 0 20px 0; margin-bottom: 10px; -webkit-overflow-scrolling: touch; }
        .date-chip { background: white; border: 1px solid #ddd; border-radius: 40px; padding: 12px 20px; font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap; flex-shrink: 0; min-height: 48px; display: flex; align-items: center; gap: 8px; }
        .date-chip:active { transform: scale(0.97); background: #eef2f6; }
        .date-chip.active { background: #1e3a5f; color: white; border-color: #1e3a5f; }
        .date-chip .date-seats { font-size: 11px; opacity: 0.8; margin-left: 5px; }

        .time-group { background: white; border-radius: 20px; margin-bottom: 20px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .time-header { background: #1e3a5f; color: white; padding: 16px 24px; font-weight: 700; font-size: 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; min-height: 60px; }
        .time-header:active { background: #2c4a6e; }
        .time-header .time-seats { font-size: 16px; background: rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 40px; }
        .time-content { padding: 0; display: none; }

        .summary-block { background: #f8f9fa; padding: 16px 24px; cursor: pointer; border-bottom: 1px solid #eef2f6; display: flex; justify-content: space-between; align-items: center; }
        .summary-block:active { background: #eef2f6; }
        .summary-title { font-weight: 700; font-size: 17px; color: #1e3a5f; }
        .summary-seats { background: #e0e7f0; padding: 6px 16px; border-radius: 40px; font-size: 14px; }

        .route-detail { border-bottom: 1px solid #eef2f6; padding: 20px 24px; }
        .route-title { font-weight: 700; font-size: 18px; color: #1e3a5f; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 2px solid #1e3a5f; display: inline-block; }
        .route-total { font-size: 16px; color: #003cff; font-weight: 600; margin-left: 15px; display: inline-block; }

        .passengers-list { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .passenger-card { 
            background: #fdfdfd; 
            border: 1px solid #eef2f6; 
            border-radius: 16px; 
            padding: 14px 18px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            gap: 15px;
            transition: all 0.2s ease;
        }
        .passenger-card.checked { background: #f4fbf6; border-color: #c3e6cb; }
        
        .passenger-info { display: flex; flex-direction: column; gap: 4px; flex-grow: 1; }
        .passenger-name-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .passenger-index { font-size: 13px; color: #999; font-weight: 600; }
        .passenger-name { font-size: 16px; font-weight: 700; color: #1e3a5f; }
        .passenger-seats-badge { background: #1e3a5f; color: white; font-size: 12px; padding: 2px 10px; border-radius: 10px; font-weight: 600; }
        
        .passenger-sub-row { display: flex; align-items: center; gap: 15px; font-size: 14px; color: #555; flex-wrap: wrap; margin-top: 2px; }
        .passenger-phone a { color: #003cff; text-decoration: none; font-weight: 500; }

        .status-button {
            border: none;
            padding: 10px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 125px;
            justify-content: center;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .status-button.waiting { background: #f0f2f5; color: #666; border: 1px solid #ddd; }
        .status-button.arrived { background: #2ecc71; color: white; box-shadow: 0 2px 6px rgba(46,204,113,0.3); }
        .status-button:active { transform: scale(0.95); }
        .status-button:disabled { opacity: 0.5; cursor: wait; }

        .payment-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
        }
        .payment-cash { background: #d4edda; color: #04701d; border: 1px solid #c3e6cb; }
        .payment-cashless { background: #e8d9ff; color: #2b0367; border: 1px solid #d1c4e9; }

        .empty-state { text-align: center; padding: 50px; background: white; border-radius: 20px; color: #999; font-size: 15px; }
        .loading { text-align: center; padding: 50px; color: #666; font-size: 15px; }
        .info-note { background: #e8f4fd; border-radius: 12px; padding: 12px 18px; margin-top: 20px; font-size: 13px; color: #1e3a5f; }
        .zero-badge { background: rgba(255,255,255,0.2); }

        @media (max-width: 700px) {
            body { padding: 12px; }
            .container { max-width: 100%; }
            h1 { font-size: 22px; }
            .route-detail { padding: 14px 18px; }
            .time-header { padding: 12px 18px; font-size: 17px; min-height: 52px; }
            .time-header .time-seats { font-size: 13px; padding: 4px 12px; }
            .date-chip { padding: 8px 16px; font-size: 13px; min-height: 44px; }
            .summary-block { padding: 12px 18px; }
            .summary-title { font-size: 15px; }
            .route-title { font-size: 16px; }
            .passenger-card { padding: 12px; flex-direction: column; align-items: stretch; gap: 10px; }
            .status-button { width: 100%; padding: 12px; }
            .driver-selector { padding: 12px 16px; }
            .driver-selector select { padding: 8px 12px; font-size: 14px; min-width: 140px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 10px;">
        <h1>
            <button class="back-btn" id="backBtn" style="display: none;">←</button>
            <span id="pageTitle">👑 Учёт пассажиров — Владелец</span>
        </h1>
    </div>

    <div class="driver-selector">
        <label>👨‍✈️ Просмотр от:</label>
        <select id="driverSelect">
            <option value="all">👑 Владелец (все рейсы)</option>
            <option value="Алексей Б.">🚛 Алексей Б.</option>
            <option value="Валентин К.">🚛 Валентин К.</option>
            <option value="Владимир Л.">🚛 Владимир Л.</option>
            <option value="Влад Н.">🚛 Влад Н.</option>
        </select>
        <div class="driver-note" id="driverNote">👑 Все рейсы</div>
    </div>

    <div class="subtitle" id="subtitle">Актуальные рейсы на ближайшие дни</div>
    <div id="mainContent"><div class="loading">Загрузка данных...</div></div>
    <div class="info-note">Нажмите на время → общая сводка → карточки пассажиров. Изменения мгновенно улетают в общую базу данных. Синхронизировано между Владельцем и Водителями.</div>
</div>

<script>
    // Твоя ссылка на макрос Google
    const API_URL = 'https://script.google.com/macros/s/AKfycbzXNEfQLW7S6GP_FLi_RDBLuK64mNUxkbRmJghXXj1Jtkqx2VtlRzp2DbIj1M03AI4i/exec';
    const TIME_ORDER = ['03:30', '10:00', '11:30', '14:00', '15:30', '16:30', '18:00', '21:30'];

    let allData = [];
    let currentView = 'dates';
    let selectedDate = null;
    let currentDriver = 'all';

    function logDebug(msg, data) {
        console.log(`[DEBUG] ${msg}`, data || '');
    }

    function formatPayment(payment, note) {
        const noteStr = note ? ` (${note})` : '';
        if (!payment || payment === '') {
            return `<span class="payment-badge payment-cashless">Безнал${noteStr}</span>`;
        }
        const lowerPayment = payment.toLowerCase();
        if (lowerPayment.includes('нал') || lowerPayment.includes('налич') || /^\d/.test(payment)) {
            const moneyMatch = payment.match(/\d+/);
            if (moneyMatch) return `<span class="payment-badge payment-cash">Нал ${moneyMatch[0]} ₽</span>`;
            return `<span class="payment-badge payment-cash">Наличные</span>`;
        }
        if (lowerPayment.includes('безнал') || lowerPayment === 'без') {
            return `<span class="payment-badge payment-cashless">Безнал${noteStr}</span>`;
        }
        return `<span class="payment-badge payment-cashless">${payment}${noteStr}</span>`;
    }

    function filterByDriver(data) {
        if (currentDriver === 'all') return data;
        return data.filter(item => item.driver === currentDriver);
    }

    function parseDate(dateStr) {
        if (!dateStr) return new Date();
        let parts = String(dateStr).split('.');
        if (parts.length === 3) return new Date(parts[2], parts[1] - 1, parts[0]);
        return new Date(dateStr);
    }

    function kisDateUpcoming(dateStr) {
        let today = new Date();
        today.setHours(0, 0, 0, 0);
        let date = parseDate(dateStr);
        date.setHours(0, 0, 0, 0);
        return date >= today;
    }

    function getUpcomingDates(datesArray, limit = 7) {
        let futureDates = datesArray.filter(date => kisDateUpcoming(date));
        futureDates.sort((a,b) => parseDate(a) - parseDate(b));
        return futureDates.slice(0, limit);
    }

    async function loadData() {
        try {
            logDebug('Начинаем загрузку данных из API');
            const noCacheUrl = API_URL + (API_URL.includes('?') ? '&' : '?') + '_nocache=' + Date.now();
            const response = await fetch(noCacheUrl);
            const data = await response.json();
            if (data.error) throw new Error(data.error);

            allData = data.filter(item => item !== null && item.date && item.route && item.time).map(item => {
                let rawDate = item.date;
                if (typeof rawDate === 'string' && rawDate.includes('GMT')) {
                    let d = new Date(rawDate);
                    if (!isNaN(d.getTime())) {
                        let day = d.getDate(), month = d.getMonth() + 1, year = d.getFullYear();
                        item.date = (day < 10 ? '0' + day : day) + '.' + (month < 10 ? '0' + month : month) + '.' + year;
                    }
                } else if (rawDate instanceof Date) {
                    let day = rawDate.getDate(), month = rawDate.getMonth() + 1, year = rawDate.getFullYear();
                    item.date = (day < 10 ? '0' + day : day) + '.' + (month < 10 ? '0' + month : month) + '.' + year;
                }
                return item;
            });
            
            if (allData.length === 0) {
                document.getElementById('mainContent').innerHTML = '<div class="empty-state">Нет данных. Проверьте записи в Google таблице.</div>';
            } else {
                renderCurrentView();
            }
        } catch (error) {
            document.getElementById('mainContent').innerHTML = `<div class="empty-state">Ошибка загрузки данных: ${error.message}</div>`;
        }
    }

    // ПОЛНОСТЬЮ ИСПРАВЛЕННАЯ ФУНКЦИЯ ОТПРАВКИ POST
    async function togglePassengerStatus(passengerObj, buttonElement, cardElement) {
        const isCurrentlyChecked = buttonElement.classList.contains('arrived');
        const nextCheckedState = !isCurrentlyChecked;
        
        buttonElement.disabled = true;
        
        try {
            // Передаем заголовки text/plain для обхода CORS и отправляем rowId
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ 
                    rowId: passengerObj.rowId,
                    date: passengerObj.date,
                    time: passengerObj.time,
                    name: passengerObj.name,
                    phone: passengerObj.phone,
                    checked: nextCheckedState 
                })
            });
            
            // Если скрипт вернул ответ (в режиме CORS), мы можем обновить локальные стили
            const item = allData.find(d => 
                d.rowId === passengerObj.rowId || (
                d.date === passengerObj.date && 
                d.time.substring(0, 5) === passengerObj.time.substring(0, 5) && 
                d.name === passengerObj.name && 
                d.phone === passengerObj.phone
                )
            );
            if (item) item.checked = nextCheckedState;
            
            // Визуальное переключение карточки
            if (nextCheckedState) {
                buttonElement.className = 'status-button arrived';
                buttonElement.innerHTML = '✅ На месте';
                cardElement.classList.add('checked');
            } else {
                buttonElement.className = 'status-button waiting';
                buttonElement.innerHTML = '⏳ Ожидает';
                cardElement.classList.remove('checked');
            }
            
        } catch (error) {
            console.error("Ошибка сети при смене статуса:", error);
            alert('Не удалось сохранить изменения. Проверьте подключение к сети.');
        } finally {
            buttonElement.disabled = false;
        }
    }

    function getFilteredData() { return filterByDriver(allData); }
    
    function getUniqueDates() {
        let filtered = getFilteredData();
        let dates = [...new Set(filtered.map(item => item.date))];
        return getUpcomingDates(dates, 7);
    }
    
    function getTotalSeatsForDate(date) {
        return getFilteredData().filter(item => item.date === date).reduce((sum, item) => sum + item.seats, 0);
    }

    function getAllTimesWithRoutesForOwner(date) {
        let filtered = getFilteredData().filter(item => item.date === date);
        const result = [];
        for (let time of TIME_ORDER) {
            const itemsAtTime = filtered.filter(item => {
                if (!item.time) return false;
                let tStr = String(item.time).trim();
                if (tStr.includes(' ') || tStr.includes(':')) {
                    let match = tStr.match(/(\d{2}):(\d{2})/);
                    if (match) tStr = match[1] + ':' + match[2];
                }
                return tStr.substring(0, 5) === time.substring(0, 5);
            });

            if (itemsAtTime.length > 0) {
                const routesMap = new Map();
                itemsAtTime.forEach(item => {
                    let currentSeats = routesMap.get(item.route) || 0;
                    routesMap.set(item.route, currentSeats + item.seats);
                });
                const routes = Object.fromEntries(routesMap);
                const totalSeats = Object.values(routes).reduce((a,b) => a + b, 0);
                result.push({ time: time, routes: routes, totalSeats: totalSeats, isEmpty: false });
            } else {
                result.push({ time: time, routes: {}, totalSeats: 0, isEmpty: true });
            }
        }
        return result;
    }

    function getNonEmptyTimesWithRoutesForDriver(date) {
        let filtered = getFilteredData().filter(item => item.date === date);
        const result = [];
        for (let time of TIME_ORDER) {
            const itemsAtTime = filtered.filter(item => {
                if (!item.time) return false;
                let tStr = String(item.time).trim();
                if (tStr.includes(' ') || tStr.includes(':')) {
                    let match = tStr.match(/(\d{2}):(\d{2})/);
                    if (match) tStr = match[1] + ':' + match[2];
                }
                return tStr.substring(0, 5) === time.substring(0, 5);
            });

            if (itemsAtTime.length > 0) {
                const routesMap = new Map();
                itemsAtTime.forEach(item => {
                    let currentSeats = routesMap.get(item.route) || 0;
                    routesMap.set(item.route, currentSeats + item.seats);
                });
                const routes = Object.fromEntries(routesMap);
                const totalSeats = Object.values(routes).reduce((a,b) => a + b, 0);
                result.push({ time: time, routes: routes, totalSeats: totalSeats, isEmpty: false });
            }
        }
        return result;
    }

    function getPassengersByDateTime(date, time, route) {
        let filtered = getFilteredData();
        return filtered.filter(item => {
            if (!item.time) return false;
            let tStr = String(item.time).trim();
            if (tStr.includes(' ') || tStr.includes(':')) {
                let match = tStr.match(/(\d{2}):(\d{2})/);
                if (match) tStr = match[1] + ':' + match[2];
            }
            return item.date === date && tStr.substring(0, 5) === time.substring(0, 5) && item.route === route;
        });
    }

    function updateUI() {
        const subtitle = document.getElementById('subtitle');
        const driverNote = document.getElementById('driverNote');
        if (currentDriver === 'all') {
            subtitle.innerHTML = 'Актуальные рейсы на ближайшие дни';
            driverNote.innerHTML = '👑 Все рейсы';
        } else {
            let filtered = getFilteredData();
            subtitle.innerHTML = `Рейсы для ${currentDriver} (всего мест: ${filtered.reduce((s,item)=>s+item.seats,0)})`;
            driverNote.innerHTML = `🚛 Показываются только рейсы водителя ${currentDriver}`;
        }
    }

    function renderCurrentView() {
        if (currentView === 'dates') renderDatesView();
        else if (currentView === 'times') renderTimesView();
        const backBtn = document.getElementById('backBtn');
        backBtn.style.display = currentView === 'dates' ? 'none' : 'inline-block';
        updateUI();
    }

    function renderDatesView() {
        const container = document.getElementById('mainContent');
        const dates = getUniqueDates();
        if (dates.length === 0) {
            container.innerHTML = '<div class="empty-state">Нет доступных рейсов на ближайшие дни</div>';
            return;
        }
        container.innerHTML = `<div class="dates-scroll">${dates.map(date => `<div class="date-chip" data-date="${date}">${date}<span class="date-seats">${getTotalSeatsForDate(date)} м</span></div>`).join('')}</div><div id="timesContainer"></div>`;

        document.querySelectorAll('.date-chip').forEach(chip => {
            chip.onclick = () => {
                selectedDate = chip.dataset.date;
                document.querySelectorAll('.date-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                renderTimesView();
                currentView = 'times';
                renderCurrentView();
            };
        });

        if (selectedDate && dates.includes(selectedDate)) {
            const activeChip = document.querySelector(`.date-chip[data-date="${selectedDate}"]`);
            if (activeChip) activeChip.click();
        } else if (dates.length > 0) {
            document.querySelector('.date-chip').click();
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m));
    }

    function renderTimesView() {
        const container = document.getElementById('timesContainer') || document.getElementById('mainContent');
        if (!selectedDate) {
            container.innerHTML = '<div class="empty-state">Выберите дату</div>';
            return;
        }

        let timeSlots = [];
        const isOwner = (currentDriver === 'all');

        if (isOwner) {
            timeSlots = getAllTimesWithRoutesForOwner(selectedDate);
            if (timeSlots.length === 0) {
                container.innerHTML = '<div class="empty-state">Нет данных по этому дню</div>';
                return;
            }
        } else {
            timeSlots = getNonEmptyTimesWithRoutesForDriver(selectedDate);
            if (timeSlots.length === 0) {
                container.innerHTML = '<div class="empty-state">Нет пассажиров на эту дату у этого водителя</div>';
                return;
            }
        }

        container.innerHTML = timeSlots.map(slot => {
            if (slot.isEmpty && isOwner) {
                return `
                    <div class="time-group">
                        <div class="time-header" data-time="${slot.time}">
                            <span>${slot.time}</span>
                            <span class="time-seats zero-badge">0 мест</span>
                        </div>
                        <div class="time-content" id="tc-${slot.time.replace(':', '')}" style="display:none">
                            <div class="empty-state" style="padding: 25px; margin: 10px;">✈️ Нет пассажиров в это время</div>
                        </div>
                    </div>
                `;
            } 
            else if (!slot.isEmpty) {
                const hasRoutes = Object.keys(slot.routes).length > 0;
                return `
                    <div class="time-group">
                        <div class="time-header" data-time="${slot.time}">
                            <span>${slot.time}</span>
                            <span class="time-seats">${slot.totalSeats} мест</span>
                        </div>
                        <div class="time-content" id="tc-${slot.time.replace(':', '')}" style="display:none">
                            ${hasRoutes ? `
                                <div class="summary-block" data-time="${slot.time}">
                                    <span class="summary-title">Общая сводка</span>
                                    <span class="summary-seats">${slot.totalSeats} мест</span>
                                </div>
                                <div class="routes-details" id="rd-${slot.time.replace(':', '')}" style="display:none">
                                    ${Object.keys(slot.routes).map(route => {
                                        const passengers = getPassengersByDateTime(selectedDate, slot.time, route);
                                        const totalSeats = passengers.reduce((s,p) => s + p.seats, 0);
                                        
                                        return `
                                        <div class="route-detail">
                                            <div>
                                                <span class="route-title">${escapeHtml(route.replace('-', ' → '))}</span>
                                                <span class="route-total">${totalSeats} чел</span>
                                            </div>
                                            ${passengers.length === 0 ? '<div class="empty-state">Нет пассажиров</div>' : `
                                                <div class="passengers-list">
                                                    ${passengers.map((p, idx) => {
                                                        const cardClass = p.checked ? 'passenger-card checked' : 'passenger-card';
                                                        const btnClass = p.checked ? 'status-button arrived' : 'status-button waiting';
                                                        const btnText = p.checked ? '✅ На месте' : '⏳ Ожидает';
                                                        const phoneClean = p.phone ? p.phone.replace(/\D/g, '') : '';
                                                        
                                                        return `
                                                        <div class="${cardClass}" id="pc-${p.rowId}">
                                                            <div class="passenger-info">
                                                                <div class="passenger-name-row">
                                                                    <span class="passenger-index">#${idx+1}</span>
                                                                    <span class="passenger-name">${escapeHtml(p.name)}</span>
                                                                    <span class="passenger-seats-badge">${p.seats} мест</span>
                                                                </div>
                                                                <div class="passenger-sub-row">
                                                                    <span class="passenger-phone">📞 <a href="tel:${phoneClean}">${escapeHtml(p.phone)}</a></span>
                                                                    <span class="passenger-payment">${formatPayment(p.payment, p.note)}</span>
                                                                </div>
                                                            </div>
                                                            <button class="${btnClass}" 
                                                                    data-date="${p.date}" 
                                                                    data-time="${p.time}" 
                                                                    data-name="${escapeHtml(p.name)}" 
                                                                    data-phone="${escapeHtml(p.phone)}" 
                                                                    data-rowid="${p.rowId}">${btnText}</button>
                                                        </div>`;
                                                    }).join('')}
                                                </div>
                                            `}
                                        </div>`;
                                    }).join('')}
                                </div>
                            ` : '<div class="empty-state" style="padding: 25px;">Нет данных о маршрутах</div>'}
                        </div>
                    </div>
                `;
            }
            return '';
        }).join('');

        // Логика аккордеонов времени
        document.querySelectorAll('.time-header').forEach(header => {
            const time = header.dataset.time;
            if (!time) return;
            const content = document.getElementById(`tc-${time.replace(':', '')}`);
            if (content) {
                const newHeader = header.cloneNode(true);
                header.parentNode.replaceChild(newHeader, header);
                newHeader.onclick = (e) => {
                    e.stopPropagation();
                    const isVisible = content.style.display === 'block';
                    content.style.display = isVisible ? 'none' : 'block';
                };
            }
        });

        // Логика аккордеонов сводки
        document.querySelectorAll('.summary-block').forEach(summary => {
            const time = summary.dataset.time;
            if (!time) return;
            const details = document.getElementById(`rd-${time.replace(':', '')}`);
            if (details) {
                const newSummary = summary.cloneNode(true);
                summary.parentNode.replaceChild(newSummary, summary);
                newSummary.onclick = (e) => {
                    e.stopPropagation();
                    if (details.style.display === 'none') {
                        details.style.display = 'block';
                        newSummary.style.background = '#eef2f6';
                    } else {
                        details.style.display = 'none';
                        newSummary.style.background = '#f8f9fa';
                    }
                };
            }
        });

        // Привязываем триггеры изменения статуса (ПЕРЕДАЕМ rowId)
        document.querySelectorAll('.status-button').forEach(btn => {
            btn.onclick = (e) => {
                e.stopPropagation();
                
                const rowId = Number(btn.dataset.rowid);
                const card = document.getElementById(`pc-${rowId}`);
                
                const passengerObj = {
                    rowId: rowId, // Ключевой параметр
                    date: btn.dataset.date,
                    time: btn.dataset.time,
                    name: btn.dataset.name,
                    phone: btn.dataset.phone
                };
                
                togglePassengerStatus(passengerObj, btn, card);
            };
        });
    }

    document.getElementById('driverSelect').onchange = (e) => {
        currentDriver = e.target.value;
        selectedDate = null;
        currentView = 'dates';
        renderCurrentView();
    };

    document.getElementById('backBtn').onclick = () => {
        if (currentView === 'times') {
            currentView = 'dates';
            selectedDate = null;
            renderCurrentView();
        }
    };

    loadData();
</script>
</body>
</html>
